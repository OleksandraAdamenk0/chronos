<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" aria-labelledby="title desc" role="img">
    <title id="title">Techno Clock Logo</title>
    <desc id="desc">Futuristic neon clock logo with circular dark background for visibility on white.</desc>

    <defs>
        <!-- neon gradient -->
        <linearGradient id="g-neon" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#3be2ff"/>
            <stop offset="0.5" stop-color="#7b4bff"/>
            <stop offset="1" stop-color="#ff4ec8"/>
        </linearGradient>

        <filter id="f-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- circular dark background -->
    <circle cx="256" cy="256" r="200" fill="#10121c"/>

    <g transform="translate(256,256)">
        <!-- concentric neon rings -->
        <circle r="160" fill="none" stroke="url(#g-neon)" stroke-width="4" opacity="0.6"/>
        <circle r="120" fill="none" stroke="url(#g-neon)" stroke-width="3" opacity="0.5"/>
        <circle r="80" fill="none" stroke="url(#g-neon)" stroke-width="3" opacity="0.4"/>

        <!-- radial grid lines -->
        <g stroke="url(#g-neon)" stroke-width="2" opacity="0.45">
            <line x1="0" y1="-160" x2="0" y2="160"/>
            <line x1="-160" y1="0" x2="160" y2="0"/>
            <line x1="-113" y1="-113" x2="113" y2="113"/>
            <line x1="-113" y1="113" x2="113" y2="-113"/>
        </g>

        <!-- neon dots -->
        <g>
            <circle cx="0" cy="-160" r="12" fill="url(#g-neon)" filter="url(#f-glow)"/>
            <circle cx="0" cy="160" r="12" fill="url(#g-neon)" filter="url(#f-glow)"/>
            <circle cx="-160" cy="0" r="12" fill="url(#g-neon)" filter="url(#f-glow)"/>
            <circle cx="160" cy="0" r="12" fill="url(#g-neon)" filter="url(#f-glow)"/>
        </g>

        <!-- bold futuristic arrows -->
        <g filter="url(#f-glow)">
            <polygon points="-12,0 12,0 0,-130" fill="url(#g-neon)" transform="rotate(-50)"/>
            <polygon points="-10,0 10,0 0,-170" fill="url(#g-neon)" transform="rotate(20)"/>
        </g>
    </g>
</svg>
